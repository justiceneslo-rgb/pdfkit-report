name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['18', '20', '22', '24']
        include:
          # One run elsewhere, because path handling and font availability are
          # the two things that differ per platform.
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: unit tests
        run: npm test

      - name: type declarations
        run: npm run types

      - name: the example still renders
        run: npm run example

      - name: audit
        run: npm audit --audit-level=high
